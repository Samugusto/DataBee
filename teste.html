<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lateral Pin Indicator + Smooth Scroll</title>

    <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.13/dist/lenis.css">

    <style>
        * {
            margin: 0px;
            padding: 0px;
        }

        .scroll-container {
            display: flex;
            width: 100%;
            background-color: #ffffff;
        }

        .lateral-panel {
            width: 35%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
            z-index: 10;
            /* Garante que a lateral fique acima de tudo */
        }

        /* Painel da direita vira um "palco" relativo */
        .content-panel {
            width: 65%;
            height: 100vh;
            position: relative;
        }

        /* Todos os blocos ficam empilhados no mesmo lugar (absolute) */
        .section-block {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            color: rgb(0, 0, 0);

            /* Escondemos todos por padrão */
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* O primeiro bloco começa visível */
        .section-block.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .revelar-img {
            width: 70%;
            max-height: 50vh;
            object-fit: cover;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .indicators {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .indicator {
            font-size: 2rem;
            color: #444;
            font-weight: bold;
            transition: color 0.3s;
        }

        .indicator.active {
            color: #ffcd42;
        }
    </style>
</head>

<body>
    <div class="scroll-container">

        <aside class="lateral-panel">
            <div class="indicators">
                <div class="indicator active">01</div>
                <div class="indicator">02</div>
                <div class="indicator">03</div>
            </div>
        </aside>

        <main class="content-panel">

            <section class="section-block active">
                <img src="https://picsum.photos/800/600?random=1" class="revelar-img">
                <div class="revelar-texto">
                    <h2>Design Premium</h2>
                    <p>Este conteúdo aparece de forma estática, sem deslizar para cima.</p>
                </div>
            </section>

            <section class="section-block">
                <img src="https://picsum.photos/800/600?random=2" class="revelar-img">
                <div class="revelar-texto">
                    <h2>Performance Fluida</h2>
                    <p>O Lenis suaviza o scroll enquanto o GSAP troca as telas magicamente.</p>
                </div>
            </section>

            <section class="section-block">
                <img src="https://picsum.photos/800/600?random=3" class="revelar-img">
                <div class="revelar-texto">
                    <h2>Experiência Única</h2>
                    <p>Pronto! Uma transição limpa, moderna e estilo Apple.</p>
                </div>
            </section>

        </main>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>

    <script>
gsap.registerPlugin(ScrollTrigger);

// Inicializar o Lenis (Smooth Scroll)
const lenis = new Lenis({ duration: 1.2, smoothWheel: true });
lenis.on('scroll', ScrollTrigger.update);
gsap.ticker.add((time) => lenis.raf(time * 1000));
gsap.ticker.lagSmoothing(0);

// Selecionar os elementos
const blocks = document.querySelectorAll('.section-block');
const indicators = document.querySelectorAll('.indicator');

// Criar a Timeline Master que controla o efeito
const tl = gsap.timeline({
  scrollTrigger: {
    trigger: ".scroll-container",
    start: "top top",
    end: "+=3000",       // Quanto maior o número, mais o usuário tem que rolar para passar de fase
    pin: true,           // Trava o container inteiro (Esquerda e Direita grudam na tela)
    scrub: 1,            // Vincula a animação ao scroll perfeitamente
  }
});

// Criamos a animação de transição para cada bloco (a partir do segundo)
blocks.forEach((block, index) => {
  if (index === 0) return; // Pula o primeiro porque ele já começa visível

  // 1. Apaga o indicador anterior e acende o atual
  tl.to(indicators[index - 1], { color: "#444", duration: 0.5 }, `passo-${index}`)
    .to(indicators[index], { color: "#ffcd42", duration: 0.3 }, `passo-${index}`)

  // 2. Apaga o bloco de conteúdo anterior (fade-out)
  tl.to(blocks[index - 1], { opacity: 0, autoAlpha: 0, duration: 0.5 }, `passo-${index}`)
  
  // 3. Acende o novo bloco de conteúdo (fade-in) de forma estática
  tl.to(block, { opacity: 1, autoAlpha: 1, duration: 0.5 }, `passo-${index}+=0.2`);
  
  // Uma pequena pausa na timeline para o usuário conseguir ler o conteúdo antes de ir pro próximo
  tl.to({}, { duration: 1 }); 
});
    </script>
</body>

</html>
