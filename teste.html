<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lateral Pin Indicator + Smooth Scroll</title>

    <link rel="stylesheet" href="https://unpkg.com/lenis@1.1.13/dist/lenis.css">

    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        .scroll-container {
            display: flex;
            width: 100%;
            background-color: #ffffff;
        }

        .lateral-panel {
            width: 35%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
            z-index: 10;
        }

        .content-panel {
            width: 65%;
            height: 100vh;
            position: relative;
        }

        .section-block {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 10%;
            color: rgb(0, 0, 0);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .section-block.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .revelar-img {
            width: 70%;
            max-height: 50vh;
            object-fit: cover;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        /* Container que agrupa os indicadores e a linha */
        .indicators-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 20px;
        }

        /* Linha de fundo cinza (apagada) */
        .progress-line-bg {
            position: absolute;
            left: 0; /* Alinha à esquerda dos números, ajuste se preferir à direita */
            top: 10px;
            bottom: 10px;
            width: 4px;
            background-color: #444;
            border-radius: 2px;
        }

        /* Linha ativa que vai crescer com o scroll */
        .progress-line-fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffcd42; /* Cor ativa igual à do número */
            transform-origin: top;
            transform: scaleY(0); /* Começa zerada */
            border-radius: 2px;
        }

        .indicators {
            display: flex;
            flex-direction: column;
            gap: 40px; /* Aumentado um pouco para dar mais espaço à linha */
            position: relative;
            z-index: 2;
            padding-left: 20px; /* Afasta o número da linha */
        }

        .indicator {
            font-size: 2rem;
            color: #444;
            font-weight: bold;
            transition: color 0.3s;
        }

        .indicator.active {
            color: #ffcd42;
        }
    </style>
</head>

<body>
    <div class="scroll-container">

        <aside class="lateral-panel">
            <div class="indicators-wrapper">
                <div class="progress-line-bg">
                    <div class="progress-line-fill"></div>
                </div>
                
                <div class="indicators">
                    <div class="indicator active">01</div>
                    <div class="indicator">02</div>
                    <div class="indicator">03</div>
                </div>
            </div>
        </aside>

        <main class="content-panel">

            <section class="section-block active">
                <img src="https://picsum.photos/800/600?random=1" class="revelar-img">
                <div class="revelar-texto">
                    <h2>Design Premium</h2>
                    <p>Este conteúdo aparece de forma estática, sem deslizar para cima.</p>
                </div>
            </section>

            <section class="section-block">
                <img src="https://picsum.photos/800/600?random=2" class="revelar-img">
                <div class="revelar-texto">
                    <h2>Performance Fluida</h2>
                    <p>O Lenis suaviza o scroll enquanto o GSAP troca as telas magicamente.</p>
                </div>
            </section>

            <section class="section-block">
                <img src="https://picsum.photos/800/600?random=3" class="revelar-img">
                <div class="revelar-texto">
                    <h2>Experiência Única</h2>
                    <p>Pronto! Uma transição limpa, moderna e estilo Apple.</p>
                </div>
            </section>

        </main>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // Inicializar o Lenis (Smooth Scroll)
        const lenis = new Lenis({ duration: 1.2, smoothWheel: true });
        lenis.on('scroll', ScrollTrigger.update);
        gsap.ticker.add((time) => lenis.raf(time * 1000));
        gsap.ticker.lagSmoothing(0);

        // Selecionar os elementos
        const blocks = document.querySelectorAll('.section-block');
        const indicators = document.querySelectorAll('.indicator');
        const lineFill = document.querySelector('.progress-line-fill');

        // Criar a Timeline Master que controla o efeito
        const tl = gsap.timeline({
            scrollTrigger: {
                trigger: ".scroll-container",
                start: "top top",
                end: "+=3000",       
                pin: true,           
                scrub: 1,            
            }
        });

        // Quantidade total de blocos para calcular as frações da linha
        const totalBlocks = blocks.length;

        // Criamos a animação de transição para cada bloco
        blocks.forEach((block, index) => {
            if (index === 0) return; 

            // Calcula quanto da linha deve ser preenchido neste passo (ex: 50% no indicador 2, 100% no indicador 3)
            const progressProgressiva = index / (totalBlocks - 1);

            // Animação sincronizada do texto, números e o crescimento da linha amarela
            tl.to(indicators[index - 1], { color: "#444", duration: 0.5 }, `passo-${index}`)
              .to(indicators[index], { color: "#ffcd42", duration: 0.3 }, `passo-${index}`)
              .to(lineFill, { scaleY: progressProgressiva, duration: 0.5, ease: "none" }, `passo-${index}`) // Move a linha junto

            // Apaga o bloco anterior e acende o próximo
            tl.to(blocks[index - 1], { opacity: 0, autoAlpha: 0, duration: 0.5 }, `passo-${index}`)
              .to(block, { opacity: 1, autoAlpha: 1, duration: 0.5 }, `passo-${index}+=0.2`);
            
            tl.to({}, { duration: 1 }); 
        });
    </script>
</body>

</html>
